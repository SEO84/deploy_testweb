<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>이미지 변경</title>
</head>

<body>
    <header>
        <h1><a href="index.html">Perfect Golf Swing</a></h1>
        <nav>
            <ul>
                <li><a href="swing.html">Swing</a></li>
                <li><a href="3.html">Lessons</a></li>
                <li><a href="4.html">Tournaments</a></li>
                <li><a href="5.html">Accessories</a></li>
                <li><a href="practice.html">practice(5~9)</a></li>
                <li><a href="practice2.html">practice(10~13)</a></li>
                <li><a href="test.html" class="active">음식소개</a></li>
            </ul>
        </nav>

        <div class="login"><a href="1.html">Login</a></div>
    </header>
    
    <div id="nav2">
        <ul class="ul2">
            <li class="li2"><a href="#" onclick="changeBg('green')">강갈비탕</a></li>
            <li class="li2"><a href="#" onclick="changeBg('orange')">라마앤바나나</a></li>
            <li class="li2"><a href="#" onclick="changeBg('purple')">흥부돼지국밥</a></li>
            <li class="li2"><a href="#" onclick="showRandomItem()">메뉴 랜덤 보여주기</a></li>
        </ul>
    </div>

    <div id="result"></div>
    
    <script>
        function changeBg(color) {
            var result = document.querySelector('#result');
            result.innerHTML = ''; // 이전 내용 삭제

            // 색상에 따라 이미지와 설명 설정
            let items;
            if (color === 'green') {
                items = [
                    {
                        src: '강갈비탕.jpg',
                        text: [
                            '★ 강갈비탕 : 12,500원',
                            '★ 아롱사태 수육 : 24,000원',
                            '★ 강갈비국밥 : 8,500원'
                        ]
                    },
                ];
            } else if (color === 'orange') {
                items = [
                    {
                        src: '라마앤바나나.jpg',
                        text: [
                            '★ 탄두리 파니르 : 20,000원',
                            '★ 인디아 퀘사디아 : 17,000원',
                            '★ 탄두리 띠까 : 16,000원'
                        ]
                    },
                ];
            } else if (color === 'purple') {
                items = [
                    {
                        src: '흥부돼지국밥.jpg',
                        text: [
                            '★ 막 삶은 돼지국밥 : 9,000원',
                            '★ 순대국밥 : 9,000원',
                            '★ 고기왕만두(5개) : 8,000원'
                        ]
                    },
                ];
            }

            // 결과 div에 이미지와 설명 추가
            items.forEach(item => {
                let itemDiv = document.createElement('div');
                itemDiv.className = 'item';

                let img = document.createElement('img');
                img.src = item.src;
                img.className = 'image';

                let description = document.createElement('div');
                description.className = 'description';

                item.text.forEach(line => {
                    let text = document.createElement('p');
                    text.textContent = line;
                    description.appendChild(text);
                });

                itemDiv.appendChild(img);
                itemDiv.appendChild(description);
                result.appendChild(itemDiv);
            });
        }

        const menuItems = [
            {
                src: '갈비탕.jpg',
                text: ['강갈비탕 : 12,500원']
            },
            {
                src: '아롱사태수육.jpg',
                text: ['아롱사태 수육 : 24,000원']
            },
            {
                src: '갈비국밥.jpg',
                text: ['강갈비국밥 : 8,500원']
            },
            {
                src: '탄두리파니르.jpg',
                text: ['탄두리 파니르 : 20,000원']
            },
            {
                src: '인디아퀘사디아.jpg',
                text: ['인디아 퀘사디아 : 17,000원']
            },
            {
                src: '탄두리띠까.jpg',
                text: ['탄두리 띠까 : 16,000원']
            },
            {
                src: '막삶은돼지국밥.jpg',
                text: ['막 삶은 돼지국밥 : 9,000원']
            },
            {
                src: '순대국밥.jpg',
                text: ['순대국밥 : 9,000원']
            },
            {
                src: '고기왕만두.jpg',
                text: ['고기왕만두(5개) : 8,000원']
            },
        ];

        function showRandomItem() {
            const result = document.querySelector('#result');
            result.innerHTML = ''; // 이전 내용 삭제

            // 랜덤으로 하나의 아이템 선택
            const randomIndex = Math.floor(Math.random() * menuItems.length);
            const selectedItem = menuItems[randomIndex];

            // 결과 div에 이미지와 설명 추가
            let itemDiv = document.createElement('div');
            itemDiv.className = 'item';

            let img = document.createElement('img');
            img.src = selectedItem.src;
            img.className = 'image';

            let description = document.createElement('div');
            description.className = 'description';

            selectedItem.text.forEach(line => {
                let text = document.createElement('p');
                text.textContent = line;
                description.appendChild(text);
            });

            itemDiv.appendChild(img);
            itemDiv.appendChild(description);
            result.appendChild(itemDiv);
        }
    </script>
</body>
</html>
